[project]
name = "supply-chain-risk-mcp"
version = "0.1.0"
description = "MCP server for open-source dependency risk assessment"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
agents = [
    "google-genai",
]

[project.scripts]
supply-chain-risk-mcp = "server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: slow tests that spawn real processes and hit live network APIs",
]

[tool.setuptools]
packages = ["clients", "logic", "agents", "orchestration", "evals"]
py-modules = ["server"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"